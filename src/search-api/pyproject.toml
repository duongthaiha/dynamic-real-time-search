[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-catalog-search"
version = "0.1.0"
description = "Contract-first Cosmos DB catalogue search POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "azure-cosmos==4.17.1",
    "azure-identity==1.26.0",
    "aiohttp>=3.11,<4",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<1",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
]

[project.scripts]
catalog-import = "catalog_search.importer:main"
catalog-evaluate = "catalog_search.evaluate:main"

[tool.setuptools.package-data]
catalog_search = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["catalog_search", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
